name: Dart

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + tag

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin" # This is an OpenJDK distribution
          java-version: "17"

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0 # keep in sync with .fvmrc
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Build APK for debugging
      - run: flutter build apk --debug --split-per-abi -t lib/main.dart
      - run: flutter build appbundle

      # Push the release
      # Only real pushes to main publish a release, not pull requests.
      - name: Push to Releases
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/apk/debug/*"
          tag: v1.0.${{ github.run_number }}
          # Built-in per-run token; never expires (the old TOKEN PAT did).
          token: ${{ secrets.GITHUB_TOKEN }}
