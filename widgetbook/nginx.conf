server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # ponytail: Flutter web file names aren't content-hashed, so every file
    # revalidates (cheap 304 via ETag) and a deploy shows up on next reload.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
